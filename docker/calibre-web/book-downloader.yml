# Shelfmark (calibre-web-automated-book-downloader) — book/audiobook search + acquire.
#
# Flow:  Prowlarr / AudiobookBay -> qBittorrent -> Shelfmark imports -> library
#   ebooks     -> /cwa-book-ingest -> Calibre-Web  (/volume1/Media/Books/ingest)
#   audiobooks -> /audiobooks      -> Audiobookshelf staging (/volume1/Media/Audio/to_tag)
#
# CRITICAL path rule (Shelfmark's own docs): it must see download files at the SAME container
# path the download client reports. qBittorrent maps /volume1/Media/temp/downloads -> /downloads,
# so Shelfmark mounts the identical host path at /downloads. Mismatch = silent import failure
# (exactly the bug that broke Radarr earlier in this project).
#
# AUTH: ships as AUTH_METHOD=none (NO login at all). It is exposed publicly, so auth is
# mandatory — using `cwa` so it shares Calibre-Web's user database: one account per person
# works for both the library and the downloader.
#
# Secrets live in the gitignored .env beside this file.

services:
  book-downloader:
    image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
    container_name: book-downloader
    restart: unless-stopped
    environment:
      - FLASK_PORT=8084
      - UID=1000
      - GID=10
      - TZ=America/Chicago
      - USE_BOOK_TITLE=true
      - BOOK_LANGUAGE=en
      # --- Authentication (REQUIRED before exposing publicly) ---
      - AUTH_METHOD=cwa                 # use Calibre-Web's user DB
      - CWA_DB_PATH=/auth/app.db
      # --- Metadata providers ---
      # METADATA_PROVIDER defaults to "openlibrary" but the provider ships DISABLED, which
      # errors on every search. Google Books enabled as fallback (openlibrary.org had an
      # outage — connection refused on :443 — earlier the same day).
      - METADATA_PROVIDER=openlibrary
      - OPENLIBRARY_ENABLED=true
      - GOOGLEBOOKS_ENABLED=true
      - GOOGLEBOOKS_API_KEY=${GOOGLEBOOKS_API_KEY:-}
      # --- Destinations: ebooks vs audiobooks go to DIFFERENT libraries ---
      - INGEST_DIR=/cwa-book-ingest                 # ebooks -> Calibre-Web
      - DESTINATION_AUDIOBOOK=/audiobooks           # audiobooks -> Audiobookshelf staging
      - QBITTORRENT_CATEGORY=books
      - QBITTORRENT_CATEGORY_AUDIOBOOK=audiobooks   # matches the qBittorrent category already created
      - BOOK_LIBRARY_URL=https://books.patplex.net
      - AUDIOBOOK_LIBRARY_URL=https://abs.patplex.net
      # --- Prowlarr as a search source ---
      - PROWLARR_ENABLED=true
      - PROWLARR_URL=http://192.168.68.56:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - PROWLARR_AUTO_EXPAND=true
      - PROWLARR_TORRENT_CLIENT=qbittorrent
      - PROWLARR_TORRENT_ACTION=keep    # keep seeding; qBit's ratio 1.0 / 3-day limits still apply
      # --- AudiobookBay ---
      - ABB_ENABLED=true
      - ABB_HOSTNAME=${ABB_HOSTNAME}
      - ABB_PAGE_LIMIT=2
      - ABB_RATE_LIMIT_DELAY=1.5
      # --- qBittorrent (on the LAN IP; it lives in the VPN container's netns) ---
      - QBITTORRENT_URL=http://192.168.68.56:8080
      - QBITTORRENT_USERNAME=${QBIT_USER}
      - QBITTORRENT_PASSWORD=${QBIT_PASS}
    volumes:
      - /volume1/Config/shelfmark:/config
      - /volume1/Config/calibre-web:/auth              # Calibre-Web user DB, for AUTH_METHOD=cwa
      - /volume1/Media/Books/ingest:/cwa-book-ingest   # ebook hand-off to Calibre-Web
      - /volume1/Media/Audio/to_tag:/audiobooks        # audiobook hand-off to Audiobookshelf
      - /volume1/Media/temp/downloads:/downloads       # MUST match qBittorrent's /downloads
    ports:
      - "8084:8084"
