# Shelfmark (calibre-web-automated-book-downloader) — book search/acquire front-end for CWA.
#
# Bound to the LAN only and deliberately NOT added to the Cloudflare tunnel.
#
# PROWLARR INTEGRATION
# Flow:  Prowlarr (indexers) -> qBittorrent downloads -> Shelfmark imports -> CWA library
# CRITICAL: Shelfmark must see the download files at the SAME container path qBittorrent
# reports. qBittorrent maps /volume1/Media/temp/downloads -> /downloads, so Shelfmark
# mounts the identical host path at /downloads. Mismatched paths here are exactly the bug
# that broke Radarr imports earlier in this project.
#
# Secrets (Prowlarr API key, qBittorrent password) live in the gitignored .env beside this file.

services:
  book-downloader:
    image: ghcr.io/calibrain/calibre-web-automated-book-downloader:latest
    container_name: book-downloader
    restart: unless-stopped
    environment:
      - FLASK_PORT=8084
      - UID=1000
      - GID=10
      - TZ=America/Chicago
      - USE_BOOK_TITLE=true
      - BOOK_LANGUAGE=en
      # --- Metadata providers ---
      # METADATA_PROVIDER defaults to "openlibrary", but the provider ships DISABLED, which
      # produces an "Open Library not enabled" error on every search. Enable it explicitly.
      # Google Books is enabled as a fallback because openlibrary.org had an outage
      # (connection refused on :443) earlier the same day.
      - METADATA_PROVIDER=openlibrary
      - OPENLIBRARY_ENABLED=true
      - GOOGLEBOOKS_ENABLED=true
      - GOOGLEBOOKS_API_KEY=${GOOGLEBOOKS_API_KEY:-}   # optional; raises the free quota
      # --- Prowlarr as a search source ---
      - PROWLARR_ENABLED=true
      - PROWLARR_URL=http://192.168.68.56:9696
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - PROWLARR_AUTO_EXPAND=true
      - PROWLARR_TORRENT_CLIENT=qbittorrent
      - PROWLARR_TORRENT_ACTION=keep        # keep seeding after import (qBit's own ratio/time limits apply)
      # --- AudiobookBay (audiobook releases; feeds the same qBittorrent client) ---
      - ABB_ENABLED=true
      - ABB_HOSTNAME=${ABB_HOSTNAME}
      - ABB_PAGE_LIMIT=2
      - ABB_RATE_LIMIT_DELAY=1.5     # be gentle; they rate-limit
      # --- qBittorrent (reachable on the LAN IP; it lives in the VPN container's netns) ---
      - QBITTORRENT_URL=http://192.168.68.56:8080
      - QBITTORRENT_USERNAME=${QBIT_USER}
      - QBITTORRENT_PASSWORD=${QBIT_PASS}
    volumes:
      - /volume1/Config/shelfmark:/config
      - /volume1/Media/Books/ingest:/cwa-book-ingest        # hand-off to Calibre-Web
      - /volume1/Media/temp/downloads:/downloads            # MUST match qBittorrent's /downloads
    ports:
      - "192.168.68.56:8084:8084"    # LAN-only bind, not 0.0.0.0
