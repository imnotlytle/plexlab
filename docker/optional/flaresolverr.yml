# FlareSolverr was REMOVED on 2026-07-27 — it was running unused (no Prowlarr indexer
# proxy referenced it) and exposed an unauthenticated headless browser on the LAN (:8191).
#
# Re-add ONLY if you later add a Cloudflare-protected indexer that needs it:
#   1. copy this file to the NAS, e.g. /volume1/docker/flaresolverr/docker-compose.yml
#   2. `docker compose up -d`
#   3. in Prowlarr: Settings > Indexer Proxies > add FlareSolverr, Host http://<nas-ip>:8191,
#      give it a Tag, and add that tag to the indexers that require it.

services:
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
    ports:
      - "8191:8191"
    restart: unless-stopped
