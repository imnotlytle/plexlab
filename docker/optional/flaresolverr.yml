# FlareSolverr — REQUIRED for Cloudflare-protected indexers (e.g. EZTV).
# Deployed at /volume1/docker/flaresolverr on the NAS.
#
# IMPORTANT: running the container is NOT enough. It must be wired into Prowlarr:
#   Settings > Indexer Proxies > + > FlareSolverr
#     Host: http://192.168.68.56:8191   Tag: flaresolverr
#   Then add that same "flaresolverr" tag to each indexer that needs it (EZTV, etc).
# Without the proxy+tag, indexers still fail with "blocked by CloudFlare Protection".

services:
  flaresolverr:
    image: flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=info
      - TZ=America/Chicago
    ports:
      - "8191:8191"
    restart: unless-stopped
