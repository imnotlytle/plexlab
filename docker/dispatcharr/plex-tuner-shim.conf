# Presents the Dispatcharr "Plex" channel profile as an HDHomeRun device ROOT.
#
# WHY THIS IS NEEDED: Plex's HDHomeRun grabber will only talk to a device at host:port — it probes
# /discover.json, /lineup.json, /lineup_status.json and /device.xml at the URL root, and it ignores
# a path in the address you give it (verified: "Grabber: HDHomerun discovered 0 compatible devices"
# in the Plex log when pointed at .../hdhr/Plex).
#
# Dispatcharr serves its filtered profile at /hdhr/Plex/, and only serves device.xml at the
# unfiltered /hdhr/ root. So pointing Plex straight at Dispatcharr gives you either "no device
# found" or the full unfiltered 14,728-channel lineup. This shim maps the profile to a root.
#
# Stream URLs inside lineup.json are already absolute to :9191, so playback bypasses this shim
# completely — it only handles discovery. That is why it can stay this small.

server {
    listen 9192;
    server_name _;

    # Preserve the Host the client sent, so Dispatcharr builds its BaseURL against :9192 (this
    # shim) rather than :9191. Without this, Plex is told to fetch the lineup from the unfiltered
    # endpoint and the filtering silently does nothing.
    proxy_set_header Host $http_host;
    # sub_filter cannot rewrite a gzipped body.
    proxy_set_header Accept-Encoding "";

    location = /discover.json {
        proxy_pass http://192.168.68.56:9191/hdhr/Plex/discover.json;
        sub_filter_types application/json;
        sub_filter "/hdhr/Plex" "";
        sub_filter_once off;
    }

    location = /lineup.json {
        # ~1,180 channels; Dispatcharr takes a few seconds to render this.
        proxy_pass http://192.168.68.56:9191/hdhr/Plex/lineup.json;
        proxy_read_timeout 180s;
    }

    location = /lineup_status.json {
        proxy_pass http://192.168.68.56:9191/hdhr/Plex/lineup_status.json;
    }

    # Dispatcharr only exposes device.xml at the unfiltered root, so borrow it and rewrite the
    # URLs it advertises to point back at this shim.
    location = /device.xml {
        proxy_pass http://192.168.68.56:9191/hdhr/device.xml;
        sub_filter_types application/xml text/xml;
        sub_filter "/hdhr/lineup.json" "/lineup.json";
        sub_filter "/hdhr" "";
        sub_filter_once off;
    }

    location / {
        proxy_pass http://192.168.68.56:9191;
    }
}
