# Presents Dispatcharr's "PlexTop" channel profile as an HDHomeRun device ROOT for Plex.
#
# Plex's HDHomeRun grabber only talks to a bare host:port — it probes /discover.json,
# /lineup.json, /lineup_status.json and /device.xml at the URL root and ignores any path in the
# address it is given (verified in the Plex log: "HDHomerun discovered 0 compatible devices"
# when pointed at a path). Dispatcharr serves per-profile endpoints under /hdhr/<profile>/, so
# this shim maps the PlexTop profile to a root on :9192.
#
# Stream URLs inside lineup.json are absolute to :9191, so playback bypasses this shim entirely —
# it exists only for the four discovery endpoints. ~10 MB idle.

server {
    listen 9192;
    server_name _;

    # Preserve the Host the client sent so Dispatcharr advertises BaseURL against :9192 (this
    # shim) instead of :9191 — otherwise Plex would fetch the unfiltered 14,728-channel lineup.
    proxy_set_header Host $http_host;
    # sub_filter cannot rewrite a gzipped body.
    proxy_set_header Accept-Encoding "";

    location = /discover.json {
        proxy_pass http://192.168.68.56:9191/hdhr/PlexTop/discover.json;
        sub_filter_types application/json;
        sub_filter "/hdhr/PlexTop" "";
        sub_filter_once off;
    }

    location = /lineup.json {
        proxy_pass http://192.168.68.56:9191/hdhr/PlexTop/lineup.json;
        proxy_read_timeout 180s;
    }

    location = /lineup_status.json {
        proxy_pass http://192.168.68.56:9191/hdhr/PlexTop/lineup_status.json;
    }

    # Dispatcharr only serves device.xml at the unfiltered root; borrow and rewrite it.
    location = /device.xml {
        proxy_pass http://192.168.68.56:9191/hdhr/device.xml;
        sub_filter_types application/xml text/xml;
        sub_filter "/hdhr/lineup.json" "/lineup.json";
        sub_filter "/hdhr" "";
        sub_filter_once off;
    }

    location / {
        proxy_pass http://192.168.68.56:9191;
    }
}
