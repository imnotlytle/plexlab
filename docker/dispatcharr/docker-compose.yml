# Dispatcharr — IPTV middleware: ingests the provider's M3U/Xtream + EPG, curates it, and serves
# clean playlist + guide endpoints to players.
#
# CURRENT CONSUMER: TiviMate on the Fire Stick (living-room LG C5).
#   playlist  http://192.168.68.56:9191/output/m3u/TV
#   guide     http://192.168.68.56:9191/output/epg/TV
# The "TV" channel profile is built by scripts/dispatcharr-build-tv-profile.py (all sports +
# all 4K + English cable, 24h-loop channels dropped, best-quality variant per channel).
#
# HISTORY: this originally fed Plex Live TV & DVR via an HDHomeRun-emulation shim. That route was
# abandoned — Plex saves a tuner's channel map in one ~40KB-max request URI (hard ~520-channel
# cap, known unfixed bug) and its DVR API is undocumented. Full story in PLAN.md 2026-08-09.
#
# The provider's credentials are entered in the Dispatcharr web UI and live in its database under
# /volume1/Config/Dispatcharr — deliberately NOT in this file or an .env, so nothing secret can
# end up in git. max_streams is set to 4 to match the provider plan's concurrent-connection limit.
#
# LAN ONLY. Do not add this to the Cloudflare tunnel: re-serving a provider's streams publicly is
# redistribution — providers detect and ban it.

services:
  dispatcharr:
    image: ghcr.io/dispatcharr/dispatcharr:latest
    container_name: dispatcharr
    restart: unless-stopped
    environment:
      - DISPATCHARR_ENV=aio          # single container; bundles its own PostgreSQL + Redis
      - REDIS_HOST=localhost
      - CELERY_BROKER_URL=redis://localhost:6379/0
      - DISPATCHARR_LOG_LEVEL=info
      - TZ=America/Chicago
    volumes:
      # Bind mount rather than a named volume so scripts/backup-configs.sh, which snapshots
      # /volume1/Config, picks this up with no extra work.
      - /volume1/Config/Dispatcharr:/data
    ports:
      - "9191:9191"                  # web UI + m3u/epg output endpoints
    # This NAS has 8 GB total and runs Plex, the *arr stack and a VPN'd qBittorrent. The AIO image
    # is Postgres + Redis + Celery + Django in one container, which will happily grow into whatever
    # is free. There is no swap headroom to absorb that, so the cap is what stops Dispatcharr from
    # starving Plex mid-stream. Do not remove it without checking `free -h` first.
    mem_limit: 1500m
    # Deliberately NO /dev/dri: Dispatcharr only proxies streams here; the player device does the
    # decoding, and Plex owns the Intel GPU for its own transcodes.

  # Maps Dispatcharr's "PlexTop" profile (the curated <=500 lineup) to a URL root, because Plex's
  # HDHomeRun grabber only accepts a bare host:port. Discovery only; streams bypass it.
  # See plex-tuner-shim.conf. Point Plex's tuner at 192.168.68.56:9192.
  dispatcharr-plex-shim:
    image: nginx:alpine
    container_name: dispatcharr-plex-shim
    restart: unless-stopped
    depends_on:
      - dispatcharr
    volumes:
      - ./plex-tuner-shim.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9192:9192"
    mem_limit: 64m
