# VPN-protected download stack
# gluetun holds the ONLY internet exit. qBittorrent shares gluetun's network
# namespace, so if the PIA tunnel drops, qBittorrent instantly loses all
# connectivity (built-in kill-switch) — it cannot leak the real IP.
#
# Secrets come from a .env file that lives next to this file ON THE NAS and is
# NEVER committed to git. See .env.example.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"       # qBittorrent WebUI (served through gluetun)
      - "6881:6881/tcp"   # qBittorrent BitTorrent port
      - "6881:6881/udp"
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=wireguard
      - OPENVPN_USER=${PIA_USER}       # PIA login (used to generate WireGuard creds)
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=${PIA_REGION}
      - VPN_PORT_FORWARDING=on         # PIA port forwarding (NOT available on US regions)
      - FIREWALL_OUTBOUND_SUBNETS=192.168.68.0/24   # allow LAN to reach the WebUI
      - TZ=${TZ}
      - UPDATER_PERIOD=24h
    volumes:
      - /volume1/Config/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"    # <-- the kill-switch: all traffic via gluetun
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /volume1/Config/qbittorrent:/config   # existing config — torrents & settings carry over
      - /volume1/Media/temp:/downloads
    restart: unless-stopped
    # No 'ports:' here on purpose — ports are published on gluetun above.
