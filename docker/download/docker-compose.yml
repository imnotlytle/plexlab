# VPN-protected download stack — PIA via gluetun (OpenVPN).
# NOTE: gluetun's PIA integration is OpenVPN-only. OpenVPN is CPU-heavy on the N100 (~9 MB/s
# ceiling), but it's reliable. A WireGuard experiment via thrnz/docker-wireguard-pia tested
# WORSE on this connection (raw throughput ~0.1 MB/s despite 0% CPU) — parked for later tuning.
#
# qBittorrent shares gluetun's network namespace = kill-switch (no VPN, no traffic).
# Secrets come from the gitignored .env.

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      - "8080:8080"       # qBittorrent WebUI
      - "6881:6881/tcp"   # qBittorrent BitTorrent port
      - "6881:6881/udp"
    environment:
      - VPN_SERVICE_PROVIDER=private internet access
      - VPN_TYPE=openvpn
      - OPENVPN_USER=${PIA_USER}
      - OPENVPN_PASSWORD=${PIA_PASS}
      - SERVER_REGIONS=${PIA_REGION}
      - VPN_PORT_FORWARDING=on
      - FIREWALL_OUTBOUND_SUBNETS=192.168.68.0/24   # allow LAN to reach the WebUI
      - TZ=${TZ}
      - UPDATER_PERIOD=24h
    volumes:
      - /volume1/Config/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:gluetun"
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /volume1/Config/qbittorrent:/config
      - /volume1/Media/temp/downloads:/downloads
    restart: unless-stopped
