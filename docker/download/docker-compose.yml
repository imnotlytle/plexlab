# VPN-protected download stack — PIA via WireGuard (thrnz/docker-wireguard-pia).
# WireGuard is ~9x faster than OpenVPN on this N100 (measured 127 vs 14 Mbps on the same
# well-seeded torrent), because it drops OpenVPN's CPU-heavy crypto. gluetun can't do PIA
# over WireGuard, hence this dedicated container. Kill-switch + port forwarding verified.
# qBittorrent shares this container's netns (no VPN = no traffic). Secrets in gitignored .env.
# Region set via LOC below (thrnz uses PIA codes like ca_toronto, NOT gluetun's "CA Toronto").
services:
  wireguard-pia:
    image: thrnz/docker-wireguard-pia:latest
    container_name: wireguard-pia
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    environment:
      - LOC=ca_montreal
      - USER=${PIA_USER}
      - PASS=${PIA_PASS}
      - LOCAL_NETWORK=192.168.68.0/24
      - PORT_FORWARDING=1
      - KEEPALIVE=25
    volumes:
      - /volume1/docker/wireguard-pia/pia:/pia
      - /volume1/docker/wireguard-pia/shared:/pia-shared
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 https://ipinfo.io/ip >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: "service:wireguard-pia"
    depends_on:
      wireguard-pia:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - /volume1/Config/qbittorrent:/config
      - /volume1/Media/temp/downloads:/downloads
    restart: unless-stopped
