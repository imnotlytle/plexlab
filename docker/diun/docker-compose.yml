# Diun — watches all running containers and emails when a newer image is available,
# so you patch on YOUR schedule (it does NOT auto-update). Tiny footprint.
#
# Email uses Gmail SMTP. The app password is the ONLY secret — it lives in .env
# (gitignored) next to this file on the NAS. See .env.example.

services:
  diun:
    image: crazymax/diun:latest
    container_name: diun
    command: serve
    restart: unless-stopped
    environment:
      - TZ=America/Chicago
      - DIUN_WATCH_SCHEDULE=0 8 * * *              # check daily at 8:00 AM
      - DIUN_WATCH_JITTER=30s
      - DIUN_PROVIDERS_DOCKER=true
      - DIUN_PROVIDERS_DOCKER_WATCHBYDEFAULT=true  # watch every running container
      - LOG_LEVEL=info
      # --- email notifications (Gmail SMTP) ---
      - DIUN_NOTIF_MAIL_HOST=smtp.gmail.com
      - DIUN_NOTIF_MAIL_PORT=587
      - DIUN_NOTIF_MAIL_SSL=false                  # STARTTLS on 587
      - DIUN_NOTIF_MAIL_USERNAME=p.lytle43@gmail.com
      - DIUN_NOTIF_MAIL_PASSWORD=${DIUN_MAIL_APP_PASSWORD}   # from .env (gitignored)
      - DIUN_NOTIF_MAIL_FROM=p.lytle43@gmail.com
      - DIUN_NOTIF_MAIL_TO=p.lytle43@gmail.com
    volumes:
      - /volume1/docker/diun/data:/data
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: just reads image tags
